default_group_behavior:
  enabled: false
  archive: false
  speak: false
  proactive_reply: true
  proactive_interval_seconds: "180-480"
  proactive_min_new_messages: 4
  # Harness local observation admission; legacy participation keeps its setting above.
  proactive_observation_minimum_messages: 8
  proactive_observation_interval_seconds: 300
  proactive_observation_max_backoff_seconds: 1800
  proactive_observation_hourly_models: 6
  proactive_observation_hourly_speeches: 3
  proactive_observation_speech_cooldown_seconds: 600
  proactive_feedback_enabled: true
  proactive_feedback_quiet_seconds: 1200
  proactive_feedback_duration_seconds: 7200
  proactive_feedback_interval_seconds: "600-1200"
  # Set a positive value to let a busy group use this local traffic gate
  # instead of an upstream interjection judge.
  proactive_local_traffic_threshold: 0
  image_generation: true
  memory_enabled: false
  recent_context_limit: 100

groups:
  "100000001":
    enabled: true
    archive: true
    speak: true
    proactive_reply: true
    proactive_interval_seconds: "180-480"
    image_generation: true
    long_context_history: false
    memory_enabled: true
    recent_context_limit: null

  "100000002":
    enabled: true
    archive: false
    speak: true
    proactive_reply: false
    proactive_interval_seconds: "180-480"
    image_generation: false
    memory_enabled: false
    recent_context_limit: 100
